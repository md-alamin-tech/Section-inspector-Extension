<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      width: 260px;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .label { font-size: 13px; font-weight: 500; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #d1d5db; border-radius: 24px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #10B981; }
    input:checked + .slider::before { transform: translateX(20px); }
    .hint { margin-top: 12px; font-size: 12px; color: #6b7280; line-height: 1.5; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Section Code Inspector</h1>
  <div class="row">
    <span class="label">Status: <span id="status">OFF</span></span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="hint">
    ON korle hover kore pura <b>section</b> highlight hobe. <b>Click</b> korle code box ashbe, <b>Copy Code</b> chapo. Chhoto element lagle <b>Alt+Click</b>. Box bondho korte <b>✕ Close</b> ba <b>Esc</b>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
